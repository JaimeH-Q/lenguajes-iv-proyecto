<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo: conversor de temperatura</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      label { display: block; margin: 0.6rem 0; }
      input { font-size: 1.2rem; width: 8rem; }
    </style>
  </head>
  <body>
    <div>
      <label>Celsius <input id="celsius" type="number" value="0" /></label>
      <label>Fahrenheit <input id="fahrenheit" type="number" value="32" /></label>
    </div>
    <script>
      const celsius = document.getElementById('celsius')
      const fahrenheit = document.getElementById('fahrenheit')
      celsius.oninput = () => { fahrenheit.value = (celsius.value * 9 / 5 + 32).toFixed(1) }
      fahrenheit.oninput = () => { celsius.value = ((fahrenheit.value - 32) * 5 / 9).toFixed(1) }
    </script>
  </body>
</html>
